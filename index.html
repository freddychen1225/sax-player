<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sax 練團播放器</title>
    <style>
        :root {
            --bg-color: #222;
            --card-color: #333;
            --accent-color: #ff9f43;
            --text-main: #fff;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
            text-align: center;
        }

        /* 歌曲資訊區塊 (包含進度條) */
        .info-box {
            background: var(--card-color);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .track-title {
            font-size: 1.6rem;
            font-weight: bold;
            color: var(--accent-color);
            margin-bottom: 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .track-status { 
            font-size: 0.9rem; 
            color: #ccc; 
            margin-top: 5px;
            display: flex;
            justify-content: space-between;
        }

        /* 進度條樣式 (跟速度條做區隔，細一點) */
        input[type=range].seek-bar {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: #555;
            border-radius: 3px;
            outline: none;
        }
        input[type=range].seek-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        /* 速度控制區 */
        .speed-control {
            background: #444;
            padding: 15px 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            border: 1px solid #555;
        }

        .speed-display {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 10px;
            font-variant-numeric: tabular-nums;
        }

        /* 速度條 (維持超粗設計) */
        input[type=range].speed-slider {
            -webkit-appearance: none;
            width: 100%;
            height: 40px;
            background: #222;
            border-radius: 20px;
            outline: none;
            margin: 10px 0;
        }
        input[type=range].speed-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--accent-color);
            cursor: pointer;
            border: 4px solid #fff;
            box-shadow: 0 0 10px rgba(255, 159, 67, 0.6);
        }

        .reset-btn {
            background: #666;
            color: white;
            border: none;
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-top: 5px;
            cursor: pointer;
        }

        /* 播放控制區 */
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .btn-ctrl {
            background: none;
            border: 2px solid #fff;
            color: #fff;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
        }
        .btn-ctrl:active { background: #fff; color: #222; }
        
        .btn-play {
            width: 70px;
            height: 70px;
            font-size: 28px;
            background: var(--accent-color);
            border: none;
            color: #000;
            box-shadow: 0 0 15px rgba(255, 159, 67, 0.4);
        }

        /* 播放清單 */
        .playlist {
            flex: 1;
            background: var(--card-color);
            border-radius: 10px;
            overflow-y: auto;
            text-align: left;
            min-height: 150px;
        }
        .playlist-item {
            padding: 15px;
            border-bottom: 1px solid #444;
            cursor: pointer;
            font-size: 0.95rem;
        }
        .playlist-item.active { color: var(--accent-color); font-weight: bold; }

        /* 匯入按鈕 */
        .import-btn {
            margin-top: 10px;
            background: #fff;
            color: #000;
            border: none;
            padding: 15px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
        }

        #file-input { display: none; }

        .footer {
            margin-top: 20px;
            font-size: 0.7rem;
            color: #666;
            letter-spacing: 1px;
        }

    </style>
</head>
<body>

    <div class="info-box">
        <div class="track-title" id="track-title">尚未載入歌曲</div>
        
        <!-- 新增：進度條 -->
        <input type="range" class="seek-bar" id="seek-bar" value="0" max="100">
        
        <div class="track-status">
            <span id="curr-time">0:00</span>
            <span id="total-time">0:00</span>
        </div>
    </div>

    <div class="speed-control">
        <div class="speed-display" id="speed-val">原速 (1.0x)</div>
        <input type="range" class="speed-slider" id="speed-slider" min="0.5" max="1.5" step="0.05" value="1.0">
        <button class="reset-btn" onclick="resetSpeed()">↺ 回到原速</button>
    </div>

    <div class="controls">
        <button class="btn-ctrl" onclick="prevTrack()">⏮</button>
        <button class="btn-ctrl btn-play" onclick="togglePlay()" id="play-btn">▶</button>
        <button class="btn-ctrl" onclick="nextTrack()">⏭</button>
    </div>

    <div class="playlist" id="playlist">
        <div style="padding:20px; color:#666; text-align:center;">等待匯入音樂...</div>
    </div>

    <button class="import-btn" onclick="document.getElementById('file-input').click()">
        📂 匯入音樂
    </button>
    <input type="file" id="file-input" multiple accept="audio/*, .mp3, .m4r, .m4a, .wav, .aac, .ogg, .flac, .webm, .3gp">

    <audio id="audio"></audio>

    <div class="footer">
        Freddy & Gemini 3 Pro 設計協作
    </div>

    <script>
        const audio = document.getElementById('audio');
        
        // 速度條
        const speedSlider = document.getElementById('speed-slider');
        const speedVal = document.getElementById('speed-val');
        
        // 進度條 & 時間
        const seekBar = document.getElementById('seek-bar');
        const currTimeEl = document.getElementById('curr-time');
        const totalTimeEl = document.getElementById('total-time');
        
        const titleEl = document.getElementById('track-title');
        const playBtn = document.getElementById('play-btn');
        const playlistEl = document.getElementById('playlist');

        let playlist = [];
        let currentIndex = 0;

        // --- 速度控制邏輯 ---
        speedSlider.addEventListener('input', (e) => {
            const rate = parseFloat(e.target.value);
            updateSpeed(rate);
        });

        function updateSpeed(rate) {
            audio.playbackRate = rate;
            let percent = Math.round((rate - 1.0) * 100);
            let text = "";
            if (percent === 0) {
                text = "原速 (1.0x)";
                speedVal.style.color = "#fff";
            } else if (percent > 0) {
                text = `+${percent}% (快)`;
                speedVal.style.color = "#ff6b6b";
            } else {
                text = `${percent}% (慢)`;
                speedVal.style.color = "#54a0ff";
            }
            speedVal.innerText = text;
        }

        function resetSpeed() {
            speedSlider.value = 1.0;
            updateSpeed(1.0);
        }

        // --- 檔案匯入邏輯 ---
        document.getElementById('file-input').addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;
            
            files.forEach(file => {
                playlist.push({
                    name: file.name.replace(/\.[^/.]+$/, ""),
                    src: URL.createObjectURL(file)
                });
            });
            renderPlaylist();
            if (playlist.length === files.length) loadTrack(0);
        });

        function renderPlaylist() {
            playlistEl.innerHTML = '';
            playlist.forEach((track, idx) => {
                const div = document.createElement('div');
                div.className = `playlist-item ${idx === currentIndex ? 'active' : ''}`;
                div.innerText = `${idx+1}. ${track.name}`;
                div.onclick = () => loadTrack(idx);
                playlistEl.appendChild(div);
            });
        }

        function loadTrack(idx) {
            if (idx < 0 || idx >= playlist.length) return;
            currentIndex = idx;
            audio.src = playlist[idx].src;
            titleEl.innerText = playlist[idx].name;
            renderPlaylist();
            audio.playbackRate = parseFloat(speedSlider.value);
            playAudio();
        }

        // --- 播放控制邏輯 ---
        function togglePlay() {
            audio.paused ? playAudio() : pauseAudio();
        }

        function playAudio() {
            audio.play();
            playBtn.innerText = "⏸";
        }

        function pauseAudio() {
            audio.pause();
            playBtn.innerText = "▶";
        }

        function nextTrack() {
            let next = currentIndex + 1;
            if (next >= playlist.length) next = 0;
            loadTrack(next);
        }

        function prevTrack() {
            let prev = currentIndex - 1;
            if (prev < 0) prev = playlist.length - 1;
            loadTrack(prev);
        }

        // --- 進度條邏輯 (新增) ---
        audio.addEventListener('timeupdate', () => {
            // 更新時間文字
            const curr = formatTime(audio.currentTime);
            const total = formatTime(audio.duration || 0);
            currTimeEl.innerText = curr;
            totalTimeEl.innerText = total;

            // 更新拉桿位置 (百分比)
            if (audio.duration) {
                const percent = (audio.currentTime / audio.duration) * 100;
                seekBar.value = percent;
            }
        });

        // 使用者拖曳進度條
        seekBar.addEventListener('input', () => {
            if (audio.duration) {
                const time = (seekBar.value / 100) * audio.duration;
                audio.currentTime = time;
            }
        });

        audio.addEventListener('ended', nextTrack);

        function formatTime(s) {
            const m = Math.floor(s / 60);
            const sc = Math.floor(s % 60);
            return `${m}:${sc<10?'0':''}${sc}`;
        }
    </script>
</body>
</html>
