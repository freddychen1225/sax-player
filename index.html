<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sax 練團播放器</title>
    <style>
        :root {
            --bg-color: #222;
            --card-color: #333;
            --accent-color: #ff9f43;
            --text-main: #fff;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
            text-align: center;
        }

        /* 歌曲資訊 */
        .info-box {
            background: var(--card-color);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .track-title {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--accent-color);
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .track-status { font-size: 0.9rem; color: #ccc; }

        /* 速度控制區 */
        .speed-control {
            background: #444;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            border: 1px solid #555;
        }

        .speed-display {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 10px;
            font-variant-numeric: tabular-nums;
        }

        input[type=range].speed-slider {
            -webkit-appearance: none;
            width: 100%;
            height: 40px;
            background: #222;
            border-radius: 20px;
            outline: none;
            margin: 10px 0;
        }

        input[type=range].speed-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--accent-color);
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 159, 67, 0.6);
            border: 4px solid #fff;
        }

        .reset-btn {
            background: #666;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            margin-top: 5px;
            cursor: pointer;
        }

        /* 播放控制區 */
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .btn-ctrl {
            background: none;
            border: 2px solid #fff;
            color: #fff;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
        }
        .btn-ctrl:active { background: #fff; color: #222; }
        
        .btn-play {
            width: 80px;
            height: 80px;
            font-size: 32px;
            background: var(--accent-color);
            border: none;
            color: #000;
            box-shadow: 0 0 15px rgba(255, 159, 67, 0.4);
        }

        /* 播放清單 */
        .playlist {
            flex: 1;
            background: var(--card-color);
            border-radius: 10px;
            overflow-y: auto;
            text-align: left;
        }
        .playlist-item {
            padding: 15px;
            border-bottom: 1px solid #444;
            cursor: pointer;
        }
        .playlist-item.active { color: var(--accent-color); font-weight: bold; }

        /* 匯入按鈕 */
        .import-btn {
            margin-top: 10px;
            background: #fff;
            color: #000;
            border: none;
            padding: 15px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
        }

        #file-input { display: none; }

        /* 底部簽名檔 */
        .footer {
            margin-top: 20px;
            font-size: 0.8rem;
            color: #666;
            letter-spacing: 1px;
        }

    </style>
</head>
<body>

    <div class="info-box">
        <div class="track-title" id="track-title">尚未載入歌曲</div>
        <div class="track-status" id="time-display">0:00 / 0:00</div>
    </div>

    <div class="speed-control">
        <div class="speed-display" id="speed-val">原速 (1.0x)</div>
        <input type="range" class="speed-slider" id="speed-slider" min="0.5" max="1.5" step="0.05" value="1.0">
        <button class="reset-btn" onclick="resetSpeed()">↺ 回到原速</button>
    </div>

    <div class="controls">
        <button class="btn-ctrl" onclick="prevTrack()">⏮</button>
        <button class="btn-ctrl btn-play" onclick="togglePlay()" id="play-btn">▶</button>
        <button class="btn-ctrl" onclick="nextTrack()">⏭</button>
    </div>

    <div class="playlist" id="playlist">
        <div style="padding:20px; color:#666; text-align:center;">等待匯入音樂...</div>
    </div>

    <!-- 按鈕文字改為「匯入音樂」 -->
    <button class="import-btn" onclick="document.getElementById('file-input').click()">
        📂 匯入音樂
    </button>
    
    <!-- 擴充格式支援：加入 ogg, flac, webm, 3gp 等 -->
    <input type="file" id="file-input" multiple accept="audio/*, .mp3, .m4r, .m4a, .wav, .aac, .ogg, .flac, .webm, .3gp">

    <audio id="audio"></audio>

    <!-- 協作簽名 -->
    <div class="footer">
        Freddy & Gemini 3 Pro 設計協作
    </div>

    <script>
        const audio = document.getElementById('audio');
        const slider = document.getElementById('speed-slider');
        const speedVal = document.getElementById('speed-val');
        const titleEl = document.getElementById('track-title');
        const timeDisplay = document.getElementById('time-display');
        const playBtn = document.getElementById('play-btn');
        const playlistEl = document.getElementById('playlist');

        let playlist = [];
        let currentIndex = 0;

        slider.addEventListener('input', (e) => {
            const rate = parseFloat(e.target.value);
            updateSpeed(rate);
        });

        function updateSpeed(rate) {
            audio.playbackRate = rate;
            let percent = Math.round((rate - 1.0) * 100);
            let text = "";
            if (percent === 0) {
                text = "原速 (1.0x)";
                speedVal.style.color = "#fff";
            } else if (percent > 0) {
                text = `+${percent}% (快)`;
                speedVal.style.color = "#ff6b6b";
            } else {
                text = `${percent}% (慢)`;
                speedVal.style.color = "#54a0ff";
            }
            speedVal.innerText = text;
        }

        function resetSpeed() {
            slider.value = 1.0;
            updateSpeed(1.0);
        }

        document.getElementById('file-input').addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;
            
            files.forEach(file => {
                playlist.push({
                    name: file.name.replace(/\.[^/.]+$/, ""),
                    src: URL.createObjectURL(file)
                });
            });
            renderPlaylist();
            if (playlist.length === files.length) loadTrack(0);
        });

        function renderPlaylist() {
            playlistEl.innerHTML = '';
            playlist.forEach((track, idx) => {
                const div = document.createElement('div');
                div.className = `playlist-item ${idx === currentIndex ? 'active' : ''}`;
                div.innerText = `${idx+1}. ${track.name}`;
                div.onclick = () => loadTrack(idx);
                playlistEl.appendChild(div);
            });
        }

        function loadTrack(idx) {
            if (idx < 0 || idx >= playlist.length) return;
            currentIndex = idx;
            audio.src = playlist[idx].src;
            titleEl.innerText = playlist[idx].name;
            renderPlaylist();
            audio.playbackRate = parseFloat(slider.value);
            playAudio();
        }

        function togglePlay() {
            audio.paused ? playAudio() : pauseAudio();
        }

        function playAudio() {
            audio.play();
            playBtn.innerText = "⏸";
        }

        function pauseAudio() {
            audio.pause();
            playBtn.innerText = "▶";
        }

        function nextTrack() {
            let next = currentIndex + 1;
            if (next >= playlist.length) next = 0;
            loadTrack(next);
        }

        function prevTrack() {
            let prev = currentIndex - 1;
            if (prev < 0) prev = playlist.length - 1;
            loadTrack(prev);
        }

        audio.addEventListener('timeupdate', () => {
            const curr = formatTime(audio.currentTime);
            const total = formatTime(audio.duration || 0);
            timeDisplay.innerText = `${curr} / ${total}`;
        });
        
        audio.addEventListener('ended', nextTrack);

        function formatTime(s) {
            const m = Math.floor(s / 60);
            const sc = Math.floor(s % 60);
            return `${m}:${sc<10?'0':''}${sc}`;
        }
    </script>
</body>
</html>
